<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS 911 Emergency Call Simulator</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts SF Pro / Inter -->
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #000000;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Custom iOS blur effects */
        .glass-panel {
            background: rgba(45, 45, 48, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .glass-button:active {
            background: rgba(255, 255, 255, 0.25);
        }
        /* Pulse animation for active call status */
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
        }
        .pulse-subtle {
            animation: pulse-subtle 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-full flex items-center justify-center bg-black text-white overflow-hidden">

    <!-- Phone Frame Container (iPhone 16 Pro proportional size: 393 x 852 pt) -->
    <div id="phone-container" class="relative w-full h-full max-w-[393px] max-h-[852px] bg-black flex flex-col justify-between overflow-hidden shadow-2xl sm:rounded-[48px] sm:border-[10px] sm:border-[#333333]">
        
        <!-- iOS Status Bar (Time removed) -->
        <div class="w-full px-7 pt-3.5 pb-2 flex justify-between items-center text-white text-sm font-semibold z-50 select-none">
            <div class="tracking-tight"></div>
            <!-- Dynamic Island / Notch Area -->
            <div class="absolute left-1/2 transform -translate-x-1/2 top-2.5 w-28 h-7 bg-black rounded-full flex items-center justify-center">
                <!-- Camera dot simulation -->
                <div class="absolute right-3.5 w-2.5 h-2.5 bg-[#1a1a1a] rounded-full border border-[#2a2a2a]"></div>
            </div>
        </div>

        <!-- MAIN VIEW CONTAINER -->
        <div id="main-view" class="flex-1 flex flex-col justify-between relative px-6 pb-12 pt-4 z-10">
            
            <!-- STATE 1: DIALER VIEW -->
            <div id="view-dialer" class="flex-1 flex flex-col justify-between h-full pt-2">
                <!-- Top Display Number & Delete Button -->
                <div class="text-center pt-4 px-4 flex flex-col items-center justify-center min-h-[100px] shrink-0">
                    <div id="dialed-number" class="text-5xl font-light tracking-tight text-white min-h-[60px] flex items-center justify-center break-all max-w-full"></div>
                    <button id="delete-btn" onclick="deleteKey()" class="opacity-0 pointer-events-none text-gray-400 hover:text-white transition-opacity mt-1 text-xl p-2 cursor-pointer">
                        <i class="fa-solid fa-delete-left"></i>
                    </button>
                </div>

                <!-- Keypad Grid -->
                <div class="grid grid-cols-3 gap-y-3 gap-x-5 max-w-[280px] mx-auto w-full my-auto shrink-0">
                    <!-- 1 -->
                    <div onclick="pressKey('1')" class="dial-btn w-20 h-20 rounded-full bg-[#333336] flex flex-col items-center justify-center cursor-pointer active:bg-[#555558] transition-colors select-none">
                        <span class="text-3xl font-normal">1</span>
                        <span class="text-[9px] tracking-widest text-gray-400 uppercase font-bold"></span>
                    </div>
                    <!-- 2 -->
                    <div onclick="pressKey('2')" class="dial-btn w-20 h-20 rounded-full bg-[#333336] flex flex-col items-center justify-center cursor-pointer active:bg-[#555558] transition-colors select-none">
                        <span class="text-3xl font-normal">2</span>
                        <span class="text-[9px] tracking-widest text-gray-400 uppercase font-bold">ABC</span>
                    </div>
                    <!-- 3 -->
                    <div onclick="pressKey('3')" class="dial-btn w-20 h-20 rounded-full bg-[#333336] flex flex-col items-center justify-center cursor-pointer active:bg-[#555558] transition-colors select-none">
                        <span class="text-3xl font-normal">3</span>
                        <span class="text-[9px] tracking-widest text-gray-400 uppercase font-bold">DEF</span>
                    </div>
                    <!-- 4 -->
                    <div onclick="pressKey('4')" class="dial-btn w-20 h-20 rounded-full bg-[#333336] flex flex-col items-center justify-center cursor-pointer active:bg-[#555558] transition-colors select-none">
                        <span class="text-3xl font-normal">4</span>
                        <span class="text-[9px] tracking-widest text-gray-400 uppercase font-bold">GHI</span>
                    </div>
                    <!-- 5 -->
                    <div onclick="pressKey('5')" class="dial-btn w-20 h-20 rounded-full bg-[#333336] flex flex-col items-center justify-center cursor-pointer active:bg-[#555558] transition-colors select-none">
                        <span class="text-3xl font-normal">5</span>
                        <span class="text-[9px] tracking-widest text-gray-400 uppercase font-bold">JKL</span>
                    </div>
                    <!-- 6 -->
                    <div onclick="pressKey('6')" class="dial-btn w-20 h-20 rounded-full bg-[#333336] flex flex-col items-center justify-center cursor-pointer active:bg-[#555558] transition-colors select-none">
                        <span class="text-3xl font-normal">6</span>
                        <span class="text-[9px] tracking-widest text-gray-400 uppercase font-bold">MNO</span>
                    </div>
                    <!-- 7 -->
                    <div onclick="pressKey('7')" class="dial-btn w-20 h-20 rounded-full bg-[#333336] flex flex-col items-center justify-center cursor-pointer active:bg-[#555558] transition-colors select-none">
                        <span class="text-3xl font-normal">7</span>
                        <span class="text-[9px] tracking-widest text-gray-400 uppercase font-bold">PQRS</span>
                    </div>
                    <!-- 8 -->
                    <div onclick="pressKey('8')" class="dial-btn w-20 h-20 rounded-full bg-[#333336] flex flex-col items-center justify-center cursor-pointer active:bg-[#555558] transition-colors select-none">
                        <span class="text-3xl font-normal">8</span>
                        <span class="text-[9px] tracking-widest text-gray-400 uppercase font-bold">TUV</span>
                    </div>
                    <!-- 9 -->
                    <div onclick="pressKey('9')" class="dial-btn w-20 h-20 rounded-full bg-[#333336] flex flex-col items-center justify-center cursor-pointer active:bg-[#555558] transition-colors select-none">
                        <span class="text-3xl font-normal">9</span>
                        <span class="text-[9px] tracking-widest text-gray-400 uppercase font-bold">WXYZ</span>
                    </div>
                    <!-- * -->
                    <div onclick="pressKey('*')" class="dial-btn w-20 h-20 rounded-full bg-[#333336] flex flex-col items-center justify-center cursor-pointer active:bg-[#555558] transition-colors select-none">
                        <span class="text-3xl font-normal">*</span>
                    </div>
                    <!-- 0 -->
                    <div onclick="pressKey('0')" class="dial-btn w-20 h-20 rounded-full bg-[#333336] flex flex-col items-center justify-center cursor-pointer active:bg-[#555558] transition-colors select-none">
                        <span class="text-3xl font-normal">+</span>
                        <span class="text-[9px] tracking-widest text-gray-400 uppercase font-bold">0</span>
                    </div>
                    <!-- # -->
                    <div onclick="pressKey('#')" class="dial-btn w-20 h-20 rounded-full bg-[#333336] flex flex-col items-center justify-center cursor-pointer active:bg-[#555558] transition-colors select-none">
                        <span class="text-3xl font-normal">#</span>
                    </div>
                </div>

                <!-- Call Button Section -->
                <div class="flex flex-col items-center mt-10 pb-6 shrink-0">
                    <button onclick="startCall()" class="w-20 h-20 rounded-full bg-[#34C759] flex items-center justify-center shadow-lg active:scale-95 transition-transform cursor-pointer hover:bg-[#2fb24f]">
                        <i class="fa-solid fa-phone text-3xl text-white"></i>
                    </button>
                </div>
            </div>

            <!-- STATE 2: ACTIVE / CALLING UI -->
            <div id="view-active-call" class="hidden flex-1 flex flex-col justify-between h-full pt-6">
                <!-- Caller Contact Info -->
                <div class="text-center mt-12">
                    <h2 id="active-call-number" class="text-6xl font-light tracking-tight text-white mb-2">911</h2>
                    <p id="call-status-text" class="text-gray-400 text-sm font-medium tracking-wide">Calling...</p>
                    <p id="call-timer" class="text-emerald-400 font-mono text-base mt-1 hidden">00:00</p>
                </div>

                <!-- iOS 6-grid In-Call Action Buttons -->
                <div class="grid grid-cols-3 gap-4 max-w-[300px] mx-auto w-full my-auto">
                    <!-- Mute -->
                    <button onclick="toggleButton(this, 'Mute')" class="flex flex-col items-center justify-center h-20 rounded-2xl glass-button transition-all">
                        <i class="fa-solid fa-microphone-slash text-xl text-white mb-1.5"></i>
                        <span class="text-[11px] text-gray-300 font-medium">mute</span>
                    </button>
                    <!-- Keypad -->
                    <button onclick="openKeypadModal()" class="flex flex-col items-center justify-center h-20 rounded-2xl glass-button transition-all">
                        <i class="fa-solid fa-grip text-xl text-white mb-1.5"></i>
                        <span class="text-[11px] text-gray-300 font-medium">keypad</span>
                    </button>
                    <!-- Audio / Speaker -->
                    <button onclick="toggleSpeaker(this)" id="speaker-btn" class="flex flex-col items-center justify-center h-20 rounded-2xl glass-button transition-all">
                        <i class="fa-solid fa-volume-high text-xl text-white mb-1.5"></i>
                        <span class="text-[11px] text-gray-300 font-medium">speaker</span>
                    </button>
                    <!-- Add Call -->
                    <button onclick="showToast('Additional calls are restricted during emergencies.')" class="flex flex-col items-center justify-center h-20 rounded-2xl glass-button transition-all">
                        <i class="fa-solid fa-plus text-xl text-white mb-1.5"></i>
                        <span class="text-[11px] text-gray-300 font-medium">add call</span>
                    </button>
                    <!-- FaceTime -->
                    <button onclick="showToast('Video calls are not supported for emergency services.')" class="flex flex-col items-center justify-center h-20 rounded-2xl glass-button transition-all">
                        <i class="fa-solid fa-video text-xl text-white mb-1.5"></i>
                        <span class="text-[11px] text-gray-300 font-medium">FaceTime</span>
                    </button>
                    <!-- Contacts -->
                    <button onclick="showToast('Contact access is restricted during calls.')" class="flex flex-col items-center justify-center h-20 rounded-2xl glass-button transition-all">
                        <i class="fa-solid fa-address-book text-xl text-white mb-1.5"></i>
                        <span class="text-[11px] text-gray-300 font-medium">contacts</span>
                    </button>
                </div>

                <!-- End Call Red Button Bottom -->
                <div class="flex flex-col items-center pb-8">
                    <button onclick="endCall()" class="w-20 h-20 rounded-full bg-[#FF3B30] flex items-center justify-center shadow-lg active:scale-95 transition-transform cursor-pointer hover:bg-[#e0342b]">
                        <i class="fa-solid fa-phone text-3xl text-white rotate-[135deg]"></i>
                    </button>
                </div>
            </div>

        </div>

        <!-- iOS Home Indicator Bar -->
        <div class="w-full pb-2 pt-1 flex justify-center items-center z-50 bg-black">
            <div class="w-36 h-1 bg-white/40 rounded-full"></div>
        </div>

        <!-- Floating Toast Message Box -->
        <div id="toast-box" class="absolute top-16 left-1/2 transform -translate-x-1/2 bg-[#2c2c2e]/90 text-white text-xs px-4 py-2.5 rounded-2xl shadow-xl backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-center max-w-xs border border-white/10">
            Notification
        </div>

    </div>

    <!-- JavaScript Sound and Interaction Engine -->
    <script>
        // Web Audio API Sound Generator for Keypad & Dialing tone simulation
        let audioCtx = null;
        let currentTypedNumber = "";

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Play DTMF keypad frequency tones
        function playTone(frequencies) {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const now = audioCtx.currentTime;
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc1.frequency.setValueAtTime(frequencies[0], now);
                osc2.frequency.setValueAtTime(frequencies[1], now);

                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, now + 0.2);

                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.2);
                osc2.stop(now + 0.2);
            } catch (e) {
                console.log("Audio not allowed yet or supported", e);
            }
        }

        const dtmfMap = {
            '1': [697, 1209], '2': [697, 1336], '3': [697, 1477],
            '4': [770, 1209], '5': [770, 1336], '6': [770, 1477],
            '7': [852, 1209], '8': [852, 1336], '9': [852, 1477],
            '*': [941, 1209], '0': [941, 1336], '#': [941, 1477]
        };

        function pressKey(num) {
            if (dtmfMap[num]) {
                playTone(dtmfMap[num]);
            }
            // Append number and update screen
            currentTypedNumber += num;
            updateDisplay();
        }

        function deleteKey() {
            if (currentTypedNumber.length > 0) {
                currentTypedNumber = currentTypedNumber.slice(0, -1);
                updateDisplay();
            }
        }

        function updateDisplay() {
            const displayEl = document.getElementById('dialed-number');
            const deleteBtn = document.getElementById('delete-btn');
            displayEl.innerText = currentTypedNumber;

            if (currentTypedNumber.length > 0) {
                deleteBtn.classList.remove('opacity-0', 'pointer-events-none');
                deleteBtn.classList.add('opacity-150');
            } else {
                deleteBtn.classList.remove('opacity-150');
                deleteBtn.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        // Call states variables
        let callTimerInterval = null;
        let secondsElapsed = 0;
        let ringTimeout = null;

        function startCall() {
            initAudio();
            playTone([852, 1477]); // feedback beep

            // Use typed number or default to 911 if empty
            const callTarget = currentTypedNumber.trim() === "" ? "911" : currentTypedNumber;
            document.getElementById('active-call-number').innerText = callTarget;

            // Switch views
            document.getElementById('view-dialer').classList.add('hidden');
            document.getElementById('view-active-call').classList.remove('hidden');

            const statusText = document.getElementById('call-status-text');
            const timerEl = document.getElementById('call-timer');

            statusText.innerText = "Calling...";
            timerEl.classList.add('hidden');
            secondsElapsed = 0;

            // Simulate ringing / connecting phase (e.g. 3.5 seconds then connected timer starts)
            ringTimeout = setTimeout(() => {
                statusText.innerText = "";
                timerEl.classList.remove('hidden');
                
                // Start call timer
                callTimerInterval = setInterval(() => {
                    secondsElapsed++;
                    let mins = Math.floor(secondsElapsed / 60);
                    let secs = secondsElapsed % 60;
                    timerEl.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }, 1000);
            }, 3500);
        }

        function endCall() {
            // Clear timers
            clearTimeout(ringTimeout);
            clearInterval(callTimerInterval);

            // Reset UI back to dialer view
            document.getElementById('view-active-call').classList.add('hidden');
            document.getElementById('view-dialer').classList.remove('hidden');
            document.getElementById('call-timer').classList.add('hidden');
            document.getElementById('call-status-text').innerText = "Calling...";

            // Reset input number
            currentTypedNumber = "";
            updateDisplay();

            showToast("Call Ended");
        }

        // Toggle action buttons (Mute, Speaker)
        function toggleButton(btn, name) {
            const icon = btn.querySelector('i');
            if (btn.classList.contains('bg-white')) {
                btn.classList.remove('bg-white', 'text-black');
                btn.classList.add('glass-button');
                icon.classList.remove('text-black');
                icon.classList.add('text-white');
                showToast(`${name} disabled`);
            } else {
                btn.classList.remove('glass-button');
                btn.classList.add('bg-white', 'text-black');
                icon.classList.remove('text-white');
                icon.classList.add('text-black');
                showToast(`${name} enabled`);
            }
        }

        function toggleSpeaker(btn) {
            toggleButton(btn, 'Speaker');
        }

        // Custom non-alert toast message system
        function showToast(message) {
            const toast = document.getElementById('toast-box');
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function openKeypadModal() {
            showToast("Keypad is active.");
        }
    </script>
</body>
</html>
